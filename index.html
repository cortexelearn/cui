      { type: "p", text: "CUI obligations don't stop at the prime contractor. They flow down the supply chain — and in aerospace, where a program may involve dozens of suppliers and sub-tiers, understanding flow-down is essential. A prime's compliance is only as strong as the weakest sub that touches the CUI." },

      { type: "h3", text: "What Flow-Down Means" },

      { type: "p", text: "**Flow-down** is the contractual mechanism by which obligations in a prime contract are passed to subcontractors. When a prime contract includes CUI handling requirements (DFARS 252.204-7012, CMMC requirements), the prime is obligated to flow those same requirements down to subcontractors who will handle the CUI. The subcontractor, in turn, flows them down to its own sub-tiers. The chain continues as far as the CUI travels." },

      { type: "p", text: "The principle: anyone in the supply chain who handles the CUI must meet the handling and protection obligations — you can't escape the requirements by being a sub-tier rather than the prime. The CUI carries its protection requirements with it wherever it goes." },

      { type: "h3", text: "Prime vs. Subcontractor Responsibilities" },

      { type: "ul", items: [
        "**The prime** is responsible for flowing requirements down, and bears overall accountability to the government for the contract — including ensuring its subs are appropriately handling CUI. Primes increasingly verify and require evidence of sub compliance (CMMC status, SPRS scores) before sharing CUI.",
        "**The subcontractor** is responsible for meeting the flowed-down requirements for the CUI it handles — implementing 800-171, achieving the required CMMC level, marking/handling/transmitting correctly, and reporting incidents. A sub handling CUI has the same fundamental obligations as the prime for that CUI.",
        "**Shared reality:** in 2026, primes are actively flowing down CMMC requirements and requiring subs to demonstrate compliance. A sub that can't show the required CMMC status may find itself unable to receive CUI — and therefore unable to win or keep the work."

      { type: "p", text: "As noted in Lesson 11, MSPs and other service providers that touch CUI are pulled into this web. An MSP doesn't necessarily get independently certified, but its practices are typically within the scope of its client's compliance and assessment — because the MSP's handling of the client's CUI is part of the client's compliance story. The supply chain for CUI compliance includes not just product suppliers but the IT and service providers who touch the data." },

      { type: "h3", text: "The Broadening Reach — The Proposed FAR CUI Rule" },

      { type: "p", text: "Everything above has focused on DoD (DFARS/CMMC). But CUI is a government-wide program, and the third major piece of the framework is extending it across all federal agencies:" },

      { type: "ul", items: [
        "**The proposed FAR CUI Rule** (published January 15, 2025) would implement the government-wide CUI program in the Federal Acquisition Regulation, applying CUI requirements to contractors of ALL federal executive agencies — not just DoD.",
        "**It standardizes** designation, handling, and safeguarding across government, introduces reporting and compliance obligations, and defines government and contractor roles via a standard form (referenced as the 'SF XXX') that specifies the CUI involved in a contract.",
        "**Status:** as of early 2026 it remains a proposed rule moving through the rulemaking process, not yet final. But its direction is clear: CUI obligations are broadening beyond defense to the entire federal contracting space."
      ]},

      { type: "h3", text: "The Takeaway" },

      { type: "p", text: "CUI compliance is not an island — it's a chain. For an aerospace organization that is both a prime on some programs and a sub on others, the obligations run in both directions: flowing requirements down to your suppliers, and meeting the requirements flowed down to you. And the ground is expanding: what began as a DoD-focused regime is becoming a government-wide expectation. The practical implication for anyone handling CUI is that these obligations are durable and growing, not a passing compliance fad — worth building into how the organization works rather than treating as a checkbox for a single contract. As always, confirm the specific flow-down terms in your actual contracts with your contracts and security teams." }

  {
    phase: "Phase 4", phaseColor: "#b8860b",
    title: "Capstone: Map Your CUI Lifecycle",
    subtitle: "Bring it together. Take a real workflow that touches CUI and walk it end-to-end — identify, mark, handle, transmit, store, report, decontrol — naming the rule at each step.",
    time: "40 min", type: "Capstone",
    video: null,
    resource: { type: "diagram", title: "The CUI Lifecycle — Map It End to End", caption: "Every piece of CUI moves through some subset of these stages. At each step, name the applicable rule and the responsible party — and flag where you would stop and ask your security office.", stages: [
      { label: "1 · Identify", detail: "Is it CUI? Which category (CTI, Export Control, Proprietary)? Basic or Specified?", color: "#c84b11" },
      { label: "2 · Mark", detail: "Banner marking, category markings (if Specified), designation indicator, any limited-dissemination controls.", color: "#c84b11" },
      { label: "3 · Handle / Access", detail: "Need-to-know only (plus authorized-person status if export-controlled). Secure physically when not in use.", color: "#1c4a7a" },
      { label: "4 · Transmit", detail: "Encrypt in transit, authorized channel only, recipients verified. No personal accounts.", color: "#1a6b3c" },
      { label: "5 · Store", detail: "Authorized system; FedRAMP-Moderate cloud; NIST 800-171 controls in place.", color: "#1a6b3c" },
      { label: "6 · Report (if needed)", detail: "Suspected compromise → security office immediately (DFARS 72-hour clock starts at discovery).", color: "#1a6b3c" },
      { label: "7 · Decontrol / Dispose", detail: "Only by proper authority. Destroy to standard — shred paper, sanitize media.", color: "#b8860b" }
    ] },
    content: [
      { type: "p", text: "This capstone asks you to do what compliance ultimately requires: take a real workflow from your own work that touches CUI and trace it through its entire lifecycle, naming the applicable rule at each stage. The goal isn't to memorize regulations — it's to develop the reflex of seeing the CUI lifecycle in your everyday work and knowing what each step demands." },

      { type: "h3", text: "The Lifecycle Stages" },

      { type: "p", text: "Every piece of CUI moves through some subset of these stages. For your chosen workflow, walk each one:" },

      { type: "ul", items: [
        "**1. Identify** — Is this CUI? What category (likely CTI, Export Controlled, or Proprietary in aerospace)? Is it Basic or Specified? (Lessons 2–3)",
        "**2. Mark** — Is it correctly marked — banner, category markings for Specified, designation indicator, any limited-dissemination controls? If you're creating it, are you marking it right? (Lesson 5)",
        "**3. Handle / Access** — Who has need-to-know? Is access appropriately limited? Is it physically secured when not in use? (Lessons 5–6)",
        "**4. Transmit** — How does it move? Is the channel authorized and the content encrypted? Are recipients verified for need-to-know (and authorized-person status if export-controlled)? (Lesson 9)",
        "**5. Store** — Where does it live? Is the system/cloud authorized (FedRAMP Moderate for cloud)? Are the 800-171 controls in place? (Lessons 9–10)",
        "**6. Report (if needed)** — If something goes wrong, who do you notify, how fast (72 hours for DFARS cyber incidents), and what do you preserve? (Lesson 12)",
        "**7. Decontrol / Dispose** — When it's no longer needed: is it decontrolled by proper authority, or destroyed to the required standard (shred paper, sanitize media)? (Lessons 5–6)"
      ]},

      { type: "h3", text: "A Worked Example" },

      { type: "p", text: "**Workflow:** An engineer receives an export-controlled engineering drawing from a prime, incorporates it into a sub-assembly analysis, and shares results with two colleagues and the prime." },

      { type: "ul", items: [
        "**Identify:** The drawing is marked CUI//SP-EXPT — Export Controlled, CUI Specified. Both CUI safeguarding AND ITAR/EAR access restrictions apply (Lesson 3). Specified means baseline-plus (Lesson 6).",
        "**Mark:** Preserve the existing markings; the analysis I derive from it inherits CUI status and must carry appropriate markings (Lesson 5). When unsure how to mark the derived analysis, ask the security office.",
        "**Handle:** Only colleagues with need-to-know AND authorized-person status (for the export-controlled content) may access it. A foreign-person colleague — even one I trust and work with daily — cannot, regardless of need-to-know (Lessons 3, 6).",
        "**Transmit:** Encrypted, via an authorized channel, to verified recipients only. Confirm the prime's recipient and my two colleagues are all authorized persons before sending. No personal accounts (Lesson 9).",
        "**Store:** In the organization's authorized CUI environment (e.g., a FedRAMP-Moderate-authorized or appropriately-tiered system for export-controlled data), not a personal drive (Lessons 9–10).",
        "**Report:** If I realize I sent it to the wrong recipient or a possible compromise occurs, I report to the security office immediately — discovery starts the organization's 72-hour clock (Lesson 12).",
        "**Decontrol/Dispose:** I don't decide on my own that it's decontrolled. When the working copies are no longer needed, I destroy them to standard — shred paper, sanitize any media (Lessons 5–6)."

const { useState, useMemo } = React;

// ─── Theme ───
const DARK="#1a1208",CREAM="#f5f0e8",BURNT="#c84b11",PANEL="#241a10",BORDER="rgba(245,240,232,0.12)",MUTED="#b8a98f";
const FD="'Bebas Neue','Barlow',system-ui,sans-serif",FB="'Barlow',Georgia,serif";
const PASS_PCT = 0.85;
const EXAM_TOTAL = CUI_FINAL_EXAM.length;
const PASS_SCORE = Math.ceil(EXAM_TOTAL * PASS_PCT);

// ─── localStorage helpers (graceful if blocked) ───
function lsGet(k,d){ try { const v=localStorage.getItem(k); return v===null?d:v; } catch { return d; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch {} }

function renderInline(text){
  const parts=text.split(/(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\))/g);
  return parts.map((p,i)=>{
    if(p.startsWith("**")&&p.endsWith("**"))return <strong key={i} style={{color:CREAM}}>{p.slice(2,-2)}</strong>;
    const lk=p.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
    if(lk)return <a key={i} href={lk[2]} target="_blank" rel="noopener noreferrer" style={{color:"#e8a87c",textDecoration:"underline"}}>{lk[1]}</a>;
    return <span key={i}>{p}</span>;
  });
}

function ContentBlock({block:b}){
  if(b.type==="p")return <p style={{lineHeight:1.7,margin:"0 0 16px",color:"#e8ddc9"}}>{renderInline(b.text)}</p>;
  if(b.type==="h3")return <h3 style={{fontFamily:FD,letterSpacing:"0.04em",fontSize:24,color:BURNT,margin:"28px 0 12px",textTransform:"uppercase"}}>{b.text}</h3>;
  if(b.type==="ul")return <ul style={{margin:"0 0 16px",paddingLeft:22}}>{b.items.map((it,i)=><li key={i} style={{lineHeight:1.65,margin:"0 0 10px",color:"#e8ddc9"}}>{renderInline(it)}</li>)}</ul>;
  if(b.type==="table")return(
    <div style={{overflowX:"auto",margin:"0 0 20px"}}>
      <table style={{borderCollapse:"collapse",width:"100%",fontSize:14}}>
        <thead><tr>{b.headers.map((h,i)=><th key={i} style={{textAlign:"left",padding:"10px 12px",borderBottom:`2px solid ${BURNT}`,color:BURNT,fontFamily:FD,letterSpacing:"0.03em",fontSize:16}}>{h}</th>)}</tr></thead>
        <tbody>{b.rows.map((r,ri)=><tr key={ri}>{r.map((c,ci)=><td key={ci} style={{padding:"10px 12px",borderBottom:`1px solid ${BORDER}`,color:"#e8ddc9",verticalAlign:"top"}}>{renderInline(c)}</td>)}</tr>)}</tbody>
      </table>
    </div>);
  return null;
}

function Quiz({quiz,idx}){
  const [picked,setPicked]=useState(null);
  const letters=["A","B","C","D"];
  return(
    <div style={{border:`1px solid ${BORDER}`,borderRadius:10,padding:"18px 20px",margin:"0 0 16px",background:"rgba(0,0,0,0.18)"}}>
      <div style={{fontWeight:700,color:CREAM,marginBottom:14,lineHeight:1.5}}>
        <span style={{color:BURNT,fontFamily:FD,marginRight:8,fontSize:18}}>Q{idx+1}.</span>{quiz.question}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {quiz.options.map((opt,i)=>{
          const isPicked=picked===i,isCorrect=i===quiz.correct;
          let bg="rgba(245,240,232,0.04)",bd=BORDER,col="#e8ddc9";
          if(picked!==null){if(isCorrect){bg="rgba(26,107,60,0.25)";bd="#1a6b3c";col=CREAM;}else if(isPicked){bg="rgba(200,75,17,0.18)";bd=BURNT;col=CREAM;}}
          return <button key={i} onClick={()=>picked===null&&setPicked(i)} style={{textAlign:"left",padding:"10px 14px",borderRadius:8,border:`1px solid ${bd}`,background:bg,color:col,cursor:picked===null?"pointer":"default",fontFamily:FB,fontSize:15,lineHeight:1.45}}><span style={{color:BURNT,fontWeight:700,marginRight:8}}>{letters[i]}</span>{opt}</button>;
        })}
      </div>
      {picked!==null&&<div style={{marginTop:14,padding:"12px 14px",borderRadius:8,background:"rgba(26,107,60,0.12)",borderLeft:`3px solid ${picked===quiz.correct?"#1a6b3c":BURNT}`}}>
        <div style={{fontWeight:700,color:picked===quiz.correct?"#5fbf85":BURNT,marginBottom:6}}>{picked===quiz.correct?"✓ Correct":"✗ Not quite"}</div>
        <div style={{color:"#d8ccb5",fontSize:14,lineHeight:1.6}}>{renderInline(quiz.explanation)}</div>
      </div>}
    </div>);
}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function FinalExam({onResult}){
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const questions=useMemo(()=>shuffle(CUI_FINAL_EXAM).map(q=>{
    const opts=q.options.map((text,origIdx)=>({text,origIdx}));
    const so=shuffle(opts);
    return {...q,displayOptions:so.map(o=>o.text),displayCorrect:so.findIndex(o=>o.origIdx===q.correct)};
  }),[]);
  const score=questions.reduce((a,q,i)=>a+(answers[i]===q.displayCorrect?1:0),0);
  const pct=Math.round(score/questions.length*100);
  const passed=score>=PASS_SCORE;
  const letters=["A","B","C","D"];
  function submit(){ setSubmitted(true); if(onResult) onResult(score, passed); }
  return(
    <div>
      <p style={{color:MUTED,marginBottom:20,lineHeight:1.6}}>{questions.length} questions from all four phases, random order, shuffled answers. Pass mark: <strong style={{color:CREAM}}>85% ({PASS_SCORE}/{questions.length})</strong> to earn the certificate.</p>
      {questions.map((q,i)=>(
        <div key={i} style={{border:`1px solid ${BORDER}`,borderRadius:10,padding:"16px 18px",margin:"0 0 14px",background:"rgba(0,0,0,0.18)"}}>
          <div style={{fontWeight:700,color:CREAM,marginBottom:12,lineHeight:1.5}}><span style={{color:BURNT,fontFamily:FD,marginRight:8,fontSize:17}}>{i+1}.</span><span style={{color:MUTED,fontSize:12,marginRight:8}}>[P{q.phase}]</span>{q.question}</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {q.displayOptions.map((opt,oi)=>{
              const isPicked=answers[i]===oi,isCorrect=oi===q.displayCorrect;
              let bg="rgba(245,240,232,0.04)",bd=BORDER,col="#e8ddc9";
              if(submitted){if(isCorrect){bg="rgba(26,107,60,0.25)";bd="#1a6b3c";col=CREAM;}else if(isPicked){bg="rgba(200,75,17,0.18)";bd=BURNT;col=CREAM;}}else if(isPicked){bg="rgba(200,75,17,0.12)";bd=BURNT;}
              return <button key={oi} onClick={()=>!submitted&&setAnswers(a=>({...a,[i]:oi}))} style={{textAlign:"left",padding:"9px 13px",borderRadius:7,border:`1px solid ${bd}`,background:bg,color:col,cursor:submitted?"default":"pointer",fontFamily:FB,fontSize:14.5,lineHeight:1.45}}><span style={{color:BURNT,fontWeight:700,marginRight:8}}>{letters[oi]}</span>{opt}</button>;
            })}
          </div>
          {submitted&&<div style={{marginTop:10,fontSize:13.5,color:"#d8ccb5",lineHeight:1.55,borderLeft:`3px solid ${answers[i]===q.displayCorrect?"#1a6b3c":BURNT}`,paddingLeft:12}}>{renderInline(q.explanation)}</div>}
        </div>))}
      {!submitted
        ?<button onClick={submit} style={{marginTop:8,padding:"12px 28px",borderRadius:8,border:"none",background:BURNT,color:CREAM,fontFamily:FD,fontSize:20,letterSpacing:"0.05em",cursor:"pointer",textTransform:"uppercase"}}>Submit Exam</button>
        :<div style={{marginTop:12,padding:"18px 22px",borderRadius:10,background:PANEL,border:`1px solid ${passed?"#1a6b3c":BURNT}`}}>
          <div style={{fontFamily:FD,fontSize:32,color:passed?"#5fbf85":BURNT,letterSpacing:"0.03em"}}>{score} / {questions.length} &middot; {pct}%</div>
          <div style={{color:MUTED,marginTop:4}}>{passed?"Pass — your certificate is now unlocked. See the Certificate tab.":`Below the 85% pass mark (${PASS_SCORE}/${questions.length}). Review and retry.`}</div>
          <button onClick={()=>{setAnswers({});setSubmitted(false);}} style={{marginTop:14,padding:"9px 20px",borderRadius:7,border:`1px solid ${BORDER}`,background:"transparent",color:CREAM,cursor:"pointer",fontFamily:FB}}>Retake</button>
        </div>}
    </div>);
}

// Simple deterministic verification ID from name + date
function certId(name,dateStr){
  const s=(name||"ANON")+"|"+dateStr+"|CUI";
  let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; }
  const hex=(h>>>0).toString(16).toUpperCase().padStart(8,"0");
  return "CXE-CUI-"+hex.slice(0,4)+"-"+hex.slice(4,8);
}

          </div>))}
        <button onClick={()=>go(15)} style={{display:"block",width:"100%",textAlign:"left",padding:"12px 20px",marginTop:12,border:"none",borderLeft:`3px solid ${isExam?BURNT:"transparent"}`,background:isExam?"rgba(200,75,17,0.12)":"transparent",color:isExam?CREAM:"#cdbfa6",cursor:"pointer",fontFamily:FD,fontSize:18,letterSpacing:"0.05em",textTransform:"uppercase"}}>★ Final Exam</button>
        <button onClick={()=>go(16)} style={{display:"block",width:"100%",textAlign:"left",padding:"12px 20px",border:"none",borderLeft:`3px solid ${isCert?BURNT:"transparent"}`,background:isCert?"rgba(200,75,17,0.12)":"transparent",color:isCert?CREAM:"#cdbfa6",cursor:"pointer",fontFamily:FD,fontSize:18,letterSpacing:"0.05em",textTransform:"uppercase"}}>{passed?"🎓":"🔒"} Certificate</button>
      </nav>

      <main style={{flex:1,overflowY:"auto",maxHeight:"100vh",padding:"20px 22px 80px"}}>
        <button onClick={()=>setMenuOpen(o=>!o)} style={{marginBottom:18,padding:"9px 16px",borderRadius:7,border:`1px solid ${BORDER}`,background:PANEL,color:CREAM,cursor:"pointer",fontFamily:FD,fontSize:16,letterSpacing:"0.05em"}}>{menuOpen?"✕ Close":"☰ Menu"}</button>
        {isCert?(
          <>
            <div style={{fontFamily:FD,fontSize:13,letterSpacing:"0.18em",color:BURNT}}>ACHIEVEMENT</div>
            <h1 style={{fontFamily:FD,fontSize:40,lineHeight:1.02,margin:"6px 0 24px"}}>Certificate</h1>
            <Certificate passed={passed} score={examScore<0?0:examScore}/>
          </>
        ):isExam?(
          <>
            <div style={{fontFamily:FD,fontSize:13,letterSpacing:"0.18em",color:BURNT}}>ASSESSMENT</div>
            <h1 style={{fontFamily:FD,fontSize:40,lineHeight:1.02,margin:"6px 0 24px"}}>Final Exam</h1>
            <FinalExam onResult={handleResult}/>
          </>
        ):(
          <>
            <div style={{fontFamily:FD,fontSize:13,letterSpacing:"0.16em",color:lesson.phaseColor}}>{lesson.phase} · {lesson.type} · {lesson.time}</div>
            <h1 style={{fontFamily:FD,fontSize:36,lineHeight:1.04,margin:"6px 0 8px"}}>{lesson.title}</h1>
            <p style={{color:MUTED,fontSize:16,lineHeight:1.5,margin:"0 0 24px",fontStyle:"italic"}}>{lesson.subtitle}</p>
            <VideoEmbed video={lesson.video}/>
            <ResourceBlock resource={lesson.resource}/>
            <div style={{marginBottom:32}}>{lesson.content.map((b,i)=><ContentBlock key={i} block={b}/>)}</div>
            <h2 style={{fontFamily:FD,fontSize:26,color:BURNT,letterSpacing:"0.04em",margin:"0 0 18px",textTransform:"uppercase",borderTop:`1px solid ${BORDER}`,paddingTop:26}}>Knowledge Check</h2>
            {lesson.quizzes.map((q,i)=><Quiz key={i} quiz={q} idx={i}/>)}
            <div style={{display:"flex",justifyContent:"space-between",marginTop:32,gap:12}}>
              <button disabled={active===0} onClick={()=>go(Math.max(0,active-1))} style={{padding:"10px 18px",borderRadius:7,border:`1px solid ${BORDER}`,background:"transparent",color:active===0?MUTED:CREAM,cursor:active===0?"default":"pointer",fontFamily:FB,opacity:active===0?0.4:1}}>← Prev</button>
              <button onClick={()=>go(Math.min(15,active+1))} style={{padding:"10px 18px",borderRadius:7,border:"none",background:BURNT,color:CREAM,cursor:"pointer",fontFamily:FD,fontSize:16,letterSpacing:"0.04em",textTransform:"uppercase"}}>{active===14?"Final Exam →":"Next →"}</button>
            </div>
          </>
        )}
        <div style={{marginTop:44,padding:"14px 18px",borderRadius:8,background:"rgba(0,0,0,0.25)",border:`1px solid ${BORDER}`,color:MUTED,fontSize:12.5,lineHeight:1.6}}>
          <strong style={{color:"#d8ccb5"}}>Training only — not legal or compliance advice.</strong> This is an information-awareness course for reference. CortexEdge is not a legal, regulatory, or compliance authority. Verify all specifics against current regulations, your contracts, and your security/compliance office. Content reflects early 2026 and requires SME review before operational reliance.
        </div>
      </main>
    </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<CUITrackApp />);


  </script>
</body>
</html>
