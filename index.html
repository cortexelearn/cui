    content: [
      { type: "p", text: "**Important framing before we begin.** This track is educational training, not legal or compliance advice. CUI rules carry real legal and contractual consequences, and the regulatory landscape is actively changing. Nothing here substitutes for your contract terms, your organization's security office, or a qualified compliance professional. Treat this as a map of the territory — then verify the specifics against authoritative sources and your own program before you act." },

      { type: "p", text: "With that said: this track is for aerospace and defense engineers and staff who encounter Controlled Unclassified Information in their work but aren't compliance specialists. The goal is fluency — understanding what CUI is, how to handle it, how to transmit it, and what the rules require — so you can do your job without creating a compliance incident." },

      { type: "h3", text: "The Problem CUI Solved" },

      { type: "p", text: "For decades, federal agencies protected sensitive-but-unclassified information using a chaotic patchwork of agency-specific labels: 'For Official Use Only' (FOUO), 'Sensitive But Unclassified' (SBU), 'Law Enforcement Sensitive,' and dozens more. There were over 100 such markings across government, each with its own inconsistent rules. The result was confusion — information marked one way at one agency meant something different at another, and contractors couldn't reliably know how to protect what they received." },

      { type: "p", text: "Controlled Unclassified Information was created to replace that patchwork with a single, standardized system. One framework, one set of rules, one registry of what counts and how to handle it." },

      { type: "h3", text: "The Legal Foundation" },

      { type: "p", text: "The CUI Program rests on a clear chain of authority:" },

      { type: "ul", items: [
        "**Executive Order 13556** (November 4, 2010) established the CUI Program for the entire executive branch and designated the National Archives and Records Administration (NARA) as the Executive Agent to implement and oversee it.",
        "**32 CFR Part 2002** is the federal regulation that codified the program — the binding rulebook for marking, safeguarding, disseminating, decontrolling, and disposing of CUI. It was published in 2016.",
        "**The CUI Registry** (maintained by NARA at archives.gov) is the authoritative public catalog of every approved CUI category and the specific handling rules each requires."
      ]},

      { type: "h3", text: "Who Is In Scope" },

      { type: "p", text: "The program reaches far beyond government employees. 32 CFR 2002 applies to executive branch agencies, but it also reaches contractors who — in NARA's own words — collect, develop, receive, transmit, use, handle, or store CUI during contract performance. If your company performs work for a federal agency and touches CUI in the process, you are in scope. For the defense industrial base specifically, this is enforced through contract clauses (DFARS 252.204-7012) and, increasingly, the CMMC program — both covered later in this track." },

      { type: "p", text: "The practical test: if information was created by or for the government, and a law, regulation, or government-wide policy requires it to be protected, and it came to you through your work — it's likely CUI, and these rules apply to you personally as the person handling it." },

      { type: "h3", text: "Why This Matters in Aerospace" },

      { type: "p", text: "Aerospace and defense work is saturated with CUI: controlled technical information (drawings, specifications, test data), export-controlled data, proprietary information shared under contract, and more. An engineer might touch CUI dozens of times a day without the dramatic feel of 'classified' material — which is exactly the risk. CUI mishandling rarely feels like a security breach in the moment; it feels like sending an email or saving a file. This track exists to make the rules second nature so the routine actions stay compliant." },

      { type: "h3", text: "What This Track Covers" },

      { type: "ul", items: [
        "**Phase 1** (lessons 1–3): what CUI is — the registry, categories, and how CUI relates to classified information, FCI, ITAR/EAR, and proprietary data.",
        "**Phase 2** (lessons 4–7): marking and handling — how to mark CUI correctly, the difference between CUI Basic and Specified, physical safeguarding, and the common mistakes to avoid.",
        "**Phase 3** (lessons 8–11): transmission, storage, and systems — email and encryption rules, CUI on information systems, cloud/FedRAMP requirements, and incident reporting.",
        "**Phase 4** (lessons 12–14): contractor obligations and the current landscape — CMMC in plain English, flow-down to subcontractors, and a capstone mapping a real CUI lifecycle."
      ]},

      { type: "p", text: "**A note on currency.** This material reflects the regulatory state as of early 2026. CUI rules are in active flux — the CMMC program is phasing in over several years, NIST SP 800-171 has a newer revision not yet enforced, and a government-wide FAR rule is still being finalized. Where timing matters, lessons say so. Always confirm current requirements against the regulation and your security office before relying on them." }

      { label: "NARA CUI Registry — government-wide category list", url: "https://www.archives.gov/cui/registry/category-list" },
      { label: "DoD CUI Registry — categories & abbreviations", url: "https://www.dodcui.mil/CUI-Categories-and-Abbreviations/" }
    ], expansion: "Two registries matter: the **NARA registry** defines the government-wide categories; the **DoD registry** refines them for defense contracts (e.g., CTI — Controlled Technical Information — is the everyday category for engineering data). Only the government designates CUI; contractors identify and protect what's been designated. When a marking cites a category you don't recognize, these registries are where you look it up." },
    content: [
      { type: "p", text: "CUI is not one undifferentiated bucket. It's organized into defined categories, each tied to the law, regulation, or government-wide policy that authorizes its control. Understanding this structure is what lets you answer the two questions that matter for any piece of information: is this CUI, and if so, what rules apply to it?" },

      { type: "h3", text: "The CUI Registry" },

      { type: "p", text: "NARA maintains the CUI Registry as the single authoritative public source (at archives.gov/cui). It lists every approved CUI category, organized into groupings such as Defense, Export Control, Financial, Privacy, Proprietary Business Information, and more. For each category the registry gives the authorizing basis, the marking, and any specific handling requirements. The critical principle: if a category isn't in the registry, it isn't CUI. Agencies cannot invent new control categories on their own — the registry is the closed, governing list." },

      { type: "h3", text: "CUI Basic vs. CUI Specified" },

      { type: "p", text: "Every CUI category is one of two types, and the distinction drives how you handle it:" },

      { type: "ul", items: [
        "**CUI Basic** — the default. The authorizing law or regulation requires the information to be protected but does NOT spell out specific handling controls. For CUI Basic, you apply the uniform baseline safeguarding and dissemination rules from 32 CFR 2002.",
        "**CUI Specified** — the higher-specificity type. The authorizing law or regulation lays out particular handling requirements that go beyond (or differ from) the baseline. For CUI Specified, you must follow those specific controls, which the registry points you to."
      ]},

      { type: "p", text: "The practical rule: CUI Basic gets the standard baseline; CUI Specified gets whatever the underlying authority demands. You determine which type applies by checking the category in the registry. Mistaking Specified for Basic — and applying only the baseline when stricter controls were required — is a common and serious handling error." },

      { type: "h3", text: "Categories Most Relevant to Aerospace" },

      { type: "p", text: "While the registry is broad, a handful of categories dominate aerospace and defense work:" },

      { type: "ul", items: [
        "**Controlled Technical Information (CTI)** — technical data with military or space application: engineering drawings, specifications, standards, process sheets, test and evaluation data. This is the bread-and-butter CUI of an aerospace engineering organization.",
        "**Export Controlled** — information whose export is restricted under the ITAR or EAR. Note this category sits at the intersection of CUI and export control law — both regimes apply simultaneously (covered more in the next lesson).",
        "**Proprietary Business Information** — confidential commercial or financial information provided to or generated for the government.",
        "**Privacy / PII** — personally identifiable information about individuals, where applicable."
      ]},

      { type: "h3", text: "Determining the Category Is the Government's Job — Usually" },

      { type: "p", text: "An important nuance: the authority to designate information as CUI generally rests with the government (the agency or the originating authority). As a contractor, you typically receive information that is already designated and marked, and your job is to handle it according to that designation. You don't usually get to decide on your own that something is or isn't CUI. When you create information on behalf of the government under a contract, designation flows from the contract and the agency's guidance — when in doubt, ask the contracting officer or your security office, never guess." },

      { type: "h3", text: "The Mental Model" },

      { type: "p", text: "Think of the registry as the master rulebook: every category of CUI is a chapter, each chapter tells you whether it's Basic or Specified and what protections apply. When CUI lands on your desk, the workflow is: identify the category (usually from the marking), look it up if unsure, determine Basic vs. Specified, and apply the corresponding rules. The next lessons turn each of those steps into concrete practice." }
    ],
    quizzes: [

        options: [

      },

      { type: "p", text: "The single biggest source of confusion in this area is mixing up CUI with the several adjacent categories of protected information. Each has its own rules, and they overlap in ways that trip people up. This lesson draws the boundaries clearly." },

      { type: "h3", text: "CUI vs. Classified Information" },

      { type: "p", text: "This is the most important distinction. **CUI is unclassified.** It is sensitive and controlled, but it is not Confidential, Secret, or Top Secret. The two systems are entirely separate:" },

      { type: "ul", items: [
        "**Classified information** is governed by a different legal regime (Executive Order 13526), requires security clearances for access, demands accredited facilities and systems, and carries criminal penalties under espionage statutes for mishandling.",
        "**CUI** requires no clearance, can be handled on properly-secured business systems, and is protected through the 32 CFR 2002 framework. Mishandling has serious contractual and potentially legal consequences, but it is not the same regime as classified spillage."
      ]},

      { type: "p", text: "A frequent and dangerous error is treating CUI casually because 'it's only unclassified.' Unclassified does not mean unprotected — it means a different, still-mandatory, set of protections." },

      { type: "h3", text: "CUI vs. FCI (Federal Contract Information)" },

      { type: "p", text: "FCI and CUI are often mentioned together (especially in CMMC), so the difference matters:" },

      { type: "ul", items: [
        "**FCI (Federal Contract Information)** is information provided by or generated for the government under a contract that is not intended for public release — but it is the broader, lower-sensitivity tier. Basic safeguarding applies (the 15 requirements in FAR 52.204-21).",
        "**CUI** is the more sensitive tier, requiring the fuller protections of NIST SP 800-171 (110 controls in the enforced revision).",
        "**The relationship:** all CUI is sensitive enough to also be FCI-like in nature, but not all FCI rises to CUI. Think of FCI as the broad floor and CUI as the elevated tier within it that demands more."

      { type: "p", text: "This is the overlap aerospace engineers most need to understand. Export-controlled technical data (under the ITAR or EAR) is ALSO a CUI category ('Export Controlled'). The two regimes apply at the same time:" },

        "**Export control law (ITAR/EAR)** restricts who may access the data based on nationality and location — the core concern is preventing access by foreign persons or export outside authorized destinations. Violations carry severe criminal and civil penalties.",

        "**Both apply together:** export-controlled technical data must be handled per CUI safeguarding rules AND per export-control access restrictions. Satisfying one does not satisfy the other. An aerospace engineer handling an export-controlled drawing must protect it as CUI and ensure no unauthorized foreign-person access."
      ]},

      { type: "h3", text: "CUI vs. Ordinary Proprietary Information" },

      { type: "p", text: "Companies have plenty of confidential information — trade secrets, internal financials, business plans — that is proprietary but NOT CUI. The distinguishing factor is government nexus: CUI is information the government created or possesses, or that an entity created or possesses for or on behalf of the government, that a law/regulation/government-wide policy requires to be controlled. Your company's internal pricing strategy is proprietary but not CUI. A proprietary technical report you generated under a government contract that the contract designates as controlled may well be CUI. The trigger is the government relationship plus an authorizing basis, not mere confidentiality." },

      { type: "h3", text: "A Quick Reference" },

          ["ITAR/EAR data", "No (but access-restricted)", "ITAR / EAR (+ CUI rules)", "Foreign-person access & export"],
          ["Proprietary (non-gov)", "No", "Company policy / NDA", "Business confidentiality, no gov nexus"]
        ]
      },

      { type: "p", text: "The takeaway: when information lands on your desk, the question isn't just 'is this sensitive?' but 'which regime (or regimes) governs it?' Export-controlled CUI answers 'two at once.' Getting this right determines which rules you apply — and the rest of this track assumes you can place a given piece of information in the correct bucket." }

  {

    title: "Export-Controlled CUI: When Two Regimes Collide",
    subtitle: "The high-stakes intersection where CUI and export control (ITAR/EAR) apply at once. Deemed exports, foreign-person access, and why safeguarding alone isn't enough.",
    time: "35 min", type: "Foundations",

    ], expansion: "Export-controlled CUI is governed by two regimes at once. The **CUI framework** (32 CFR 2002, NIST 800-171) controls how the data is marked and safeguarded; **export-control law** (ITAR for defense articles on the U.S. Munitions List, EAR for dual-use items on the Commerce Control List) controls *who* may access it and *where* it may go. Remember the deemed-export rule: releasing controlled technical data to a foreign person — even inside the U.S. — is treated as an export, and need-to-know never overrides authorized-person status. When both regimes apply, you must satisfy both; verify any specific access question with your export-control officer." },
    content: [
      { type: "p", text: "The previous lesson established that some CUI is also export-controlled, and that when it is, two regimes apply simultaneously. This lesson goes deep on that intersection — because for aerospace and defense work it's the single highest-stakes handling scenario, and the place where a well-intentioned engineer can commit a serious violation without ever 'leaking' anything in the conventional sense." },

      { type: "p", text: "**The same framing applies as the rest of this track: this is training, not legal advice.** Export control violations carry severe criminal and civil penalties, and the rules are genuinely complex. Nothing here substitutes for your export-control officer (or, for ITAR matters, your legally designated **Empowered Official**), your organization's Technology Control Plan (TCP, the internal access-control plan covered below), or qualified counsel. Treat this as orientation — then verify every real situation with the people whose job it is to know." },

      { type: "h3", text: "Two Regimes, One Document" },

      { type: "p", text: "Export-controlled technical data is governed by two separate legal frameworks that happen to land on the same document at the same time:" },

      { type: "ul", items: [
        "**The CUI framework** (32 CFR 2002 for federal marking, dissemination, and handling rules, paired with NIST SP 800-171 for safeguarding CUI on nonfederal systems) governs how the information is marked, safeguarded, stored, and transmitted — the focus of this whole track.",
        "**Export control law** governs WHO may access it and WHERE it may go, based on the nature of the data and the nationality/location of the recipient. The two main regimes are the **ITAR** (International Traffic in Arms Regulations, administered by the State Department, covering defense articles and defense-related technical data on the U.S. Munitions List) and the **EAR** (Export Administration Regulations, administered by the Commerce Department, covering dual-use items on the Commerce Control List)."
      ]},

      { type: "p", text: "The critical mental shift: CUI rules are about *protecting* the information; export rules are about *who is allowed to receive* it. You can perfectly satisfy every CUI safeguarding rule — encrypt it, store it in an authorized system, mark it correctly — and still commit an export violation by letting the wrong person access it. Safeguarding and access-authorization are different questions, and export-controlled CUI demands both." },

      { type: "h3", text: "The Deemed Export — The Concept That Trips Everyone" },

      { type: "p", text: "The most counterintuitive and most violated concept is the **deemed export**. Under export control law, releasing controlled technical data or technology to a **foreign person** — even inside the United States, even inside your own facility — is 'deemed' to be an export to that person's country of citizenship or permanent residency (under ITAR, all countries of current or former citizenship or permanent residency; under EAR, the most recent country of citizenship or permanent residency). Under both ITAR and EAR, a **U.S. person** includes U.S. citizens, Lawful Permanent Residents (Green Card holders), and certain protected individuals (such as asylees and refugees) — anyone else, including foreign nationals on work or student visas and foreign entities, is a foreign person. You don't have to ship anything overseas: showing an ITAR-controlled drawing to a foreign-person colleague standing next to you in a U.S. office is, in the eyes of the law, an export." },

      { type: "ul", items: [
        "**Why it matters so much in aerospace:** engineering teams are international. A brilliant colleague who is a foreign national, a visiting engineer, a partner-company employee — granting any of them access to export-controlled technical data without proper authorization (a license or a recognized exemption) can be a violation, regardless of how much you trust them or how clear their need-to-know is.",
        "**Need-to-know does NOT override export control.** This is the trap. CUI handling says 'share with those who have a need to know.' Export control says 'and ONLY if they are also authorized persons under the export regime.' Both conditions must be met. A foreign-person colleague can have a genuine need-to-know and still be barred from access by export law.",
        "**It applies to access, not just transfer.** Letting a foreign person view a screen, overhear a technical discussion, or have admin access to a system containing controlled data can all constitute deemed exports."
      ]},

      { type: "h3", text: "ITAR vs. EAR — A Brief Orientation" },

      { type: "p", text: "You don't need to be an export-control expert to handle this responsibly, but knowing the basic distinction helps you recognize when to escalate:" },

      { type: "ul", items: [
        "**ITAR** covers defense articles, defense services, and related technical data — items specifically designed, developed, or modified for military application (plus certain space items) listed on the U.S. Munitions List (USML). Controls are strict: foreign-person access generally requires prior State Department (DDTC) authorization (a license, Technical Assistance Agreement, or specific regulatory exemption). Much aerospace/defense technical data falls here.",
        "**EAR** covers dual-use items (commercial items with potential military application), certain less-sensitive military and space items moved from the USML (such as 600-series and 9x515 items), and related **technology** and software on the Commerce Control List (classified by ECCN, Export Control Classification Number, alongside unenumerated EAR99 items). License requirements — and available EAR license exceptions — depend on the item's reason for control, destination country, end-user, and end-use.",
        "**The practical point:** you usually won't determine ITAR vs. EAR jurisdiction yourself — that's a determination made by your export-control function. Your job is to recognize that a document is export-controlled (the marking, e.g., 'CUI//SP-EXPT', or an ITAR/EAR notice tells you) and to apply the access restrictions accordingly, escalating any question about a specific person's authorization."
      ]},

      { type: "h3", text: "Handling Export-Controlled CUI in Practice" },

      { type: "p", text: "Bringing CUI discipline and export discipline together, the handling rules for export-controlled CUI are the CUI rules PLUS:" },

      { type: "ul", items: [
        "**Verify authorized-person status before granting access** — not just need-to-know, but confirmed authorization under the export regime. When in doubt about a specific individual (especially foreign nationals, dual nationals, or external partners), stop and ask your export-control officer BEFORE granting access.",
        "**Mind the access surface** — screens visible to others, shared systems, cloud regions with foreign-administered infrastructure, technical discussions in mixed company. The higher cloud tiers (e.g., the more restricted government/defense tiers from the cloud lesson) exist precisely to ensure data residency and U.S.-person administration for this kind of data.",
        "**Transmission gets the export overlay too** — sending export-controlled CUI to a recipient abroad, or to a foreign person anywhere, is an export. Authorized channel + encryption (the CUI rules) is necessary but not sufficient; the recipient must also be authorized to receive it under export law.",
        "**Know your Technology Control Plan (TCP)** — organizations handling export-controlled data typically maintain a TCP defining who may access what and how it's segregated. If your organization has one, it sets your binding internal handling and access procedures — know it, follow it, and escalate any gaps to your export-control officer."
      ]},
      {type: "h3", text: "Manager Scenario: The 'Quick Code Review' Trap"},
      {type: "p", text: "Suppose your team maintains flight-control software marked CUI//SP-EXPT inside a NIST SP 800-171-compliant repository. A top-performing engineer on an H-1B visa joins your sub-team with legitimate project need-to-know, and you add them to the repo group so they can review a pull request — assuming that because they work in your U.S. office on a compliant laptop, CUI controls are satisfied. Under export law, granting that repository access can be a **deemed export**: for ITAR technical data it generally needs prior State Department authorization, and under the EAR it depends on the item and the person's country. As an engineering manager, your job is not to guess visa, citizenship, or exemption rules yourself (and never to exclude Lawful Permanent Residents, who are U.S. persons); your job is to **gate onboarding**: segregate export-controlled repos and folders per your Technology Control Plan and require written Export Control or Empowered Official verification before granting anyone access."},

      { type: "h3", text: "The One Thing to Remember" },

      { type: "p", text: "If you take away a single principle: **for export-controlled CUI, satisfying the CUI safeguarding rules is only half the job — you must also confirm the recipient is an authorized person under export law, and need-to-know never overrides that.** The dangerous failure here isn't the dramatic leak; it's the routine, well-meaning act of including a trusted foreign-person colleague on a drawing they had every business reason to see — and no legal authorization to receive. When export-controlled markings are present, the reflex must be: protect it as CUI, AND verify authorization before anyone accesses it. When unsure, the answer is always to ask your export-control officer before acting, not after." }
    ],
    quizzes: [
      {
        question: "For export-controlled CUI, why is satisfying all the CUI safeguarding rules not enough?",
        options: [
          "Because CUI rules govern how the information is protected, while export law separately governs WHO may access it — you must satisfy both, and proper safeguarding doesn't authorize access by an unauthorized person",
          "Because CUI rules don't apply to export-controlled data",
          "Because export-controlled data must also be classified",
          "Because safeguarding rules are optional for export-controlled CUI"
        ],
        correct: 0,
        explanation: "CUI rules and export rules answer different questions: protection vs. authorization-to-receive. You can encrypt, store, and mark export-controlled CUI perfectly and still commit an export violation by granting access to an unauthorized person. Both regimes apply simultaneously and both must be satisfied."
      },
      {
        question: "What is a 'deemed export'?",
        options: [
          "An export that was estimated rather than measured",
          "An export that has been approved by Customs",
          "Releasing controlled technical data to a foreign person — even inside the U.S. or inside your own facility — which is treated as an export to that person's country of nationality",
          "The shipment of a physical defense article overseas"
        ],
        correct: 2,
        explanation: "A deemed export is the release of controlled technical data to a foreign person, regardless of physical location — showing an ITAR-controlled drawing to a foreign-national colleague in a U.S. office is 'deemed' an export to their home country. No physical shipment is required; access itself can be the violation."
      },
      {
        question: "A foreign-national colleague has a clear, legitimate need-to-know for an ITAR-controlled drawing. Can they access it?",
        options: [
          "Yes — need-to-know is the governing standard for all controlled information",
          "Yes, because internal colleagues are automatically authorized",
          "Yes, as long as the drawing is encrypted first",
          "Not on need-to-know alone — export law requires they also be an authorized person (via license or recognized exemption); need-to-know never overrides the export-control access restriction"
        ],
        correct: 3,
        explanation: "This is the central trap. CUI handling says share with those who need to know; export control adds 'and only if they're also an authorized person under the regime.' Both conditions must be met. A foreign national can have genuine need-to-know and still be barred by export law absent a license or exemption — verify with the export-control officer before granting access."
      }
    ]
  },

  {
    phase: "Phase 2", phaseColor: "#1c4a7a",
    title: "Marking Basics",
    subtitle: "What a compliant CUI marking looks like: the banner, category markings, the designation indicator, and limited-dissemination controls.",
    time: "35 min", type: "Marking & Handling",
    video: { id: "UxpF21AsxZE", title: "Controlled Unclassified Information — Introduction to Marking (US National Archives)" },
    resource: { type: "reference", items: [
      { label: "NARA CUI Marking Handbook (official PDF)", url: "https://www.archives.gov/files/cui/20161206-cui-marking-handbook-v1-1.pdf" },
      { label: "DoD CUI marking desktop aid (2024, PDF)", url: "https://www.dodcui.mil/Portals/109/Documents/Desktop%20Aid%20Docs/Cleared%20CUI%20Awareness%20and%20Marking%20Training%202024.pdf" }
    ], expansion: "The **NARA Marking Handbook** is the canonical how-to: banner construction, category markings, limited-dissemination controls, portion marking, and the designation indicator. The DoD desktop aid adds DoD-specific practice — notably that DoD applies the required controls of Specified categories while using the simple 'CUI' banner (no SP- prefix in the banner during current implementation). When your customer's marking guidance and these documents differ, the contract governs — ask your security office." },
    content: [
      { type: "p", text: "Marking is how CUI announces itself. A correct marking tells every subsequent handler exactly what they're holding and how to treat it. Incorrect or missing markings are among the most common compliance failures — and because markings drive handling, a marking error cascades into handling errors. This lesson covers what a compliant marking looks like." },

      { type: "h3", text: "The CUI Banner Marking" },

      { type: "p", text: "The most visible element is the **banner marking**, which appears at the top (and bottom) of each page containing CUI. At minimum it contains the control marking 'CUI' (or the full 'CONTROLLED UNCLASSIFIED INFORMATION'). For CUI Specified, the banner extends to show more:" },

      { type: "ul", items: [
        "**The CUI control marking** — 'CUI' at minimum.",
        "**Category or subcategory markings** — for CUI Specified, the relevant category markings follow the control marking, separated by double forward slashes (e.g., 'CUI//SP-CTI' for Specified Controlled Technical Information). The registry provides the correct category abbreviations.",
        "**Limited-dissemination controls** — if dissemination is restricted, the applicable control markings appear as well, also set off by double slashes."
      ]},

      { type: "p", text: "A simple CUI Basic document may carry just 'CUI' as its banner. A CUI Specified document carries the fuller string. The banner is the at-a-glance signal; getting it right is the foundation of everything downstream." },

      { type: "h3", text: "The Designation Indicator" },

      { type: "p", text: "Every CUI document must also carry a **designation indicator** — information identifying who designated the CUI and providing a point of contact. This is typically a block on the first page identifying the controlling agency or office. Its purpose is accountability and traceability: anyone holding the document can determine where the control originated and whom to contact with questions about its handling or potential decontrol." },

      { type: "h3", text: "Portion Marking" },

      { type: "p", text: "Unlike classified information (where portion marking each paragraph is mandatory), CUI portion marking is generally permitted but not required by default — though specific agencies or contracts may require it. When used, individual portions (paragraphs, sections) are marked to show which contain CUI and which don't, helpful when a document mixes controlled and non-controlled content. Follow your contract and agency guidance on whether portion marking is expected." },

      { type: "h3", text: "Why Marking Drives Everything" },

      { type: "p", text: "The reason marking matters so much: the marking is the instruction set for every handler who touches the document next. A drawing marked 'CUI//SP-EXPT' tells the next engineer it's export-controlled CUI Specified, triggering both the safeguarding rules and the foreign-person access restrictions. If that same drawing is unmarked, the next handler may treat it as ordinary information and email it to an overseas supplier — a serious incident that traces directly back to a marking failure. Marking is not bureaucratic box-checking; it's the mechanism that makes correct handling possible." },

      { type: "h3", text: "Common Marking Errors (Preview)" },

      { type: "p", text: "We cover handling mistakes in depth in Lesson 8, but the marking-specific ones to internalize now: omitting the banner entirely; marking CUI Basic when the content is actually Specified (under-marking); failing to include the designation indicator; and inconsistent marking across pages of a multi-page document. Each of these breaks the instruction set that downstream handlers rely on." },

      { type: "p", text: "**A practical caution:** as a contractor you usually receive already-marked CUI, and your job is to preserve and respect those markings — never strip or alter them. When you generate new documents containing CUI (derived from marked material or created under contract), you become responsible for marking them correctly, following the source material's markings and your contract/agency guidance. When unsure how to mark something you've created, ask your security office before releasing it." }
    ],
    quizzes: [

        question: "What does the CUI banner marking at minimum contain, and where does it appear?",
        options: [

          "The author's name, appearing only on the last page",

      },
      {
        question: "What is the purpose of the designation indicator on a CUI document?",
        options: [
          "To state the document's expiration date",
          "To identify who designated the CUI and provide a point of contact, enabling accountability and traceability about its handling or decontrol",
          "To list everyone authorized to read the document",
          "To indicate the document's classification level"
        ],
        correct: 1,
        explanation: "The designation indicator identifies the designating agency/office and provides a point of contact. Its purpose is accountability and traceability — anyone holding the document can determine where the control originated and whom to contact with handling or decontrol questions."
      },
      {
        question: "As a contractor who receives already-marked CUI, what is your responsibility regarding those markings?",
        options: [
          "Strip the markings to simplify the document for internal use",
          "Replace all markings with your company's own labeling scheme",
          "Preserve and respect the existing markings — never strip or alter them — and when creating new CUI documents, mark them correctly per the source material and contract/agency guidance",
          "Markings only matter to the government, so contractors can ignore them"
        ],
        correct: 2,
        explanation: "Contractors usually receive already-marked CUI and must preserve and respect those markings, never stripping or altering them. When generating new documents containing CUI, you become responsible for marking them correctly per the source markings and your contract/agency guidance — and should ask your security office when unsure."
      }
    ]
  },

  {
    phase: "Phase 2", phaseColor: "#1c4a7a",
    title: "CUI Basic vs. Specified Handling",
    subtitle: "How handling rules differ between the two types, where to find the controls for a given category, and how CUI gets decontrolled.",
    time: "35 min", type: "Marking & Handling",
    video: { id: "yfzi-WzrEOc", title: "CUI Masterclass with Ryan Bonner (GRC Academy) — safeguarding & handling" },
    resource: { type: "reference", items: [
      { label: "CUI Basic vs. Specified — registry definitions (NARA)", url: "https://www.archives.gov/cui/registry/category-list" },
      { label: "CDSE IF141.16 — DoD Mandatory CUI Training (free)", url: "https://www.cdse.edu/Training/eLearning/IF141/" }
    ], expansion: "**CUI Basic** follows the uniform baseline in 32 CFR 2002; **CUI Specified** categories carry additional handling requirements written into their underlying law or regulation — the registry entry for each category tells you which. The CDSE IF141.16 course is the DoD-mandated baseline training and is free and public; a completion certificate from it is often accepted evidence of CUI awareness training under DoD contracts." },
    content: [
      { type: "p", text: "Lesson 2 introduced the Basic vs. Specified distinction at the category level. This lesson is about what it means for your actual handling — what you do differently depending on which type you're holding, and how CUI eventually stops being CUI." },

      { type: "h3", text: "Handling CUI Basic" },

      { type: "p", text: "CUI Basic follows the uniform baseline established in 32 CFR 2002. The core baseline expectations:" },

      { type: "ul", items: [
        "**Access on a lawful-government-purpose, need-to-know basis** — you may grant access to those who need it to perform authorized functions, without requiring approval from the originating agency for routine dissemination within authorized channels.",
        "**Reasonable safeguarding** — protect it from unauthorized access at a level commensurate with the risk, both physically and on information systems (the system requirements come from NIST SP 800-171, covered in Phase 3).",
        "**Marked, transmitted, and destroyed** per the baseline rules covered across this track."
      ]},

      { type: "p", text: "CUI Basic is the 'default operating mode' — apply the standard rules consistently and you're handling it correctly." },

      { type: "h3", text: "Handling CUI Specified" },

      { type: "p", text: "CUI Specified requires you to go beyond the baseline and apply the specific controls dictated by the underlying authority. The key behaviors:" },

      { type: "ul", items: [
        "**Check the registry and the authorizing law/regulation** — the registry entry for a Specified category points to the authority that prescribes its particular handling. You must follow those specifics, which may restrict dissemination more tightly, mandate particular protections, or impose other requirements.",
        "**Don't assume the baseline is enough** — the entire point of Specified is that the baseline is NOT the full requirement. Treating Specified as Basic is under-protection, and it's a genuine compliance failure.",
        "**When the specifics are unclear, escalate** — your security office or contracting officer can confirm the exact requirements for a Specified category."
      ]},

      { type: "h3", text: "Limited Dissemination Controls" },

      { type: "p", text: "Independent of Basic/Specified, CUI may carry **limited dissemination controls (LDCs)** — additional markings that further restrict who may receive the information beyond the standard need-to-know. Examples include controls restricting dissemination to specific groups or requiring originator approval before further sharing. When present (you'll see them in the banner marking), they override the more permissive default dissemination and must be honored." },

      { type: "h3", text: "Decontrol — When CUI Stops Being CUI" },

      { type: "p", text: "CUI is not necessarily permanent. **Decontrol** is the formal process by which information ceases to be CUI — when the basis for control no longer applies (e.g., information is approved for public release, a time/event-based decontrol condition is met, or the designating authority decides control is no longer warranted). Key principles:" },

      { type: "ul", items: [
        "**Decontrol is generally the designating authority's decision** — as a contractor handling received CUI, you typically don't get to unilaterally decide it's no longer controlled.",
        "**Until decontrolled, it stays CUI** — assume continued control until you have authoritative confirmation otherwise. 'I think this is old enough to not matter' is not decontrol.",
        "**Decontrol doesn't erase history** — even after decontrol, prior controlled handling obligations applied while it was CUI."
      ]},

      { type: "h3", text: "The Practical Workflow" },

      { type: "p", text: "Putting Lessons 2, 4, and 5 together: when CUI reaches you, read the marking to identify the category and whether it's Basic or Specified; apply the baseline for Basic or the specific controls for Specified; honor any limited-dissemination controls shown; and never treat something as decontrolled without authority. When any of these is unclear, the correct move is always to ask your security office rather than to guess — the cost of a question is minutes, the cost of a wrong assumption can be an incident." }
    ],
    quizzes: [
      {
        question: "Why is treating CUI Specified as if it were CUI Basic a compliance failure?",
        options: [
          "Because the entire point of Specified is that the baseline is NOT the full requirement — Specified has particular controls dictated by its authorizing authority, so applying only the baseline under-protects the information",
          "Because Specified information is classified and Basic is not",
          "Because Basic information requires more protection than Specified",
          "Because Specified CUI can never be handled by contractors"
        ],
        correct: 0,
        explanation: "CUI Specified exists precisely because its authorizing law/regulation prescribes controls beyond the baseline. Applying only the 32 CFR 2002 baseline to Specified information under-protects it — a genuine compliance failure. You must check the registry and the authorizing authority for the specific controls, and escalate when they're unclear."
      },
      {
        question: "A contractor believes a piece of CUI they received is 'probably old enough not to matter anymore.' What is the correct stance?",
        options: [
          "Treat it as decontrolled, since enough time has passed",
          "Destroy it immediately to avoid the question",
          "It remains CUI until authoritatively decontrolled — decontrol is generally the designating authority's decision, and a contractor cannot unilaterally decide received CUI is no longer controlled",
          "Email it to a colleague to get a second opinion"
        ],
        correct: 2,
        explanation: "Decontrol is a formal process, generally the designating authority's decision. Until authoritatively decontrolled, the information stays CUI — 'I think it's old enough' is not decontrol. A contractor handling received CUI typically cannot unilaterally decontrol it, and should assume continued control until confirmed otherwise."
      },
      {
        question: "What are limited dissemination controls (LDCs)?",
        options: [
          "Markings that indicate the document can be shared with anyone",
          "Controls that apply only to classified information",
          "A type of encryption applied to CUI files",
          "Additional markings that further restrict who may receive the CUI beyond the standard need-to-know, which override the more permissive default and must be honored when present"
        ],
        correct: 3,
        explanation: "LDCs are additional markings (visible in the banner) that restrict dissemination beyond standard need-to-know — for example, limiting dissemination to specific groups or requiring originator approval before further sharing. They apply independent of Basic/Specified and override the more permissive default dissemination, so they must be honored."
      }
    ]
  },

  {
    phase: "Phase 2", phaseColor: "#1c4a7a",
    title: "Physical Handling & Storage",
    subtitle: "Need-to-know access, physical safeguarding, clean-desk discipline, and the destruction and disposal requirements for CUI.",
    time: "30 min", type: "Marking & Handling",
    video: { id: "xQNTG0-snlI", title: "CUI Handling, Storage, Transmission, Disposal & Vendor Management (ICS Data)" },
    resource: { type: "reference", items: [
      { label: "DCSA CUI Training Reference Guide for Industry (PDF)", url: "https://www.dcsa.mil/Portals/91/Documents/CTP/CUI/CUI_Training_Reference_Guide_012722.pdf" },
      { label: "32 CFR 2002.16 — physical safeguarding standards (eCFR)", url: "https://www.ecfr.gov/current/title-32/part-2002" }
    ], expansion: "The DCSA industry guide consolidates physical-handling practice for contractors: controlled environments, cover sheets, storage, and — worth committing to memory — **destruction to NIST 800-88 standard (cross-cut to 1mm × 5mm particles for paper)**. 'Out of sight of unauthorized persons, secured when unattended' is the operating principle; the guide translates it into concrete office behaviors." },
    content: [
      { type: "p", text: "Much of modern CUI lives in digital systems (Phase 3 covers those), but plenty still exists physically — printed drawings, marked documents, notes, removable media. And the human behaviors around physical handling are where a lot of real-world leaks happen. This lesson covers the physical side." },

      { type: "h3", text: "Access on a Need-to-Know Basis" },

      { type: "p", text: "The foundational access principle for CUI is **lawful government purpose plus need-to-know**. You may share CUI with someone who needs it to perform an authorized function — and you should NOT share it more widely than that, even with colleagues who are 'cleared' in a general sense or who are simply curious. Need-to-know is not 'works at the same company'; it's 'needs this specific information for an authorized purpose.' Over-sharing within an organization is one of the most common and underestimated handling failures." },

      { type: "h3", text: "Physical Safeguarding" },

      { type: "p", text: "When CUI is in physical form, it must be protected from unauthorized access:" },

      { type: "ul", items: [
        "**Control physical access** — CUI documents should be stored where unauthorized individuals can't access them: locked rooms, locked cabinets/drawers, or controlled areas, appropriate to the risk. The baseline standard is that it be protected from unauthorized access during both working hours and after.",
        "**Don't leave CUI unattended in the open** — a marked drawing left on a desk, a printout left at a shared printer, a document visible to a visitor: each is an exposure. This is the basis of clean-desk discipline.",
        "**Cover or secure when not in use** — when stepping away, CUI should be turned over, covered, or secured, not left face-up where passersby can read it."
      ]},

      { type: "h3", text: "The Shared-Printer and Visitor Problems" },

      { type: "p", text: "Two everyday hazards deserve special mention. **Shared printers and copiers**: CUI sent to a communal printer and not retrieved promptly is exposed to everyone who walks by — retrieve CUI printouts immediately, and use secure-print features where available. **Visitors and uncleared persons in the workspace**: when non-need-to-know individuals (visitors, vendors, or even colleagues without need-to-know) are present, CUI must not be visible or accessible. This includes screens, whiteboards, and desk surfaces." },

      { type: "h3", text: "Destruction and Disposal" },

      { type: "p", text: "CUI does not go in the regular trash or recycling. It must be destroyed in a manner that makes it unreadable, indecipherable, and irrecoverable:" },

      { type: "ul", items: [
        "**Paper CUI** — cross-cut shredding to the standard required (the baseline references methods that render it unrecoverable; many organizations follow NSA/NIST-referenced shred standards). Tossing CUI in a recycling bin is a disposal failure.",
        "**Electronic media** — sanitized or destroyed per recognized media-sanitization guidance (e.g., NIST SP 800-88) before disposal or reuse. Simply deleting files or reformatting is generally not sufficient.",
        "**When in doubt, use approved destruction channels** — many organizations provide locked destruction bins or a designated process; use them rather than improvising."
      ]},

      { type: "h3", text: "The Human Factor" },

      { type: "p", text: "Physical CUI failures are rarely malicious — they're convenience and habit: printing something and forgetting it, leaving a drawing out during a quick meeting, tossing a marked draft in the recycling because the shredder is across the building. Because the failures are mundane, the defenses must be habitual: retrieve prints immediately, secure CUI whenever you step away, shred don't toss, and never let need-to-know erode into 'everyone here is fine.' The discipline is unglamorous, and that's exactly why it's where incidents happen." }
    ],
    quizzes: [
      {
        question: "What does 'need-to-know' actually mean for sharing CUI within your own organization?",
        options: [
          "Anyone employed at the same company may access it",
          "The person needs that specific information to perform an authorized function — not merely that they work there or are generally trustworthy",
          "Anyone who asks for it has demonstrated need-to-know",

        ],

        explanation: "Need-to-know is 'needs this specific information for an authorized purpose,' not 'works at the same company' or 'is generally cleared/trustworthy.' Over-sharing CUI internally — beyond those with a genuine functional need — is one of the most common and underestimated handling failures."
      },
      {
        question: "How must paper CUI be disposed of?",
        options: [
          "Placed in the regular recycling bin to be environmentally responsible",
          "Stored indefinitely since it can never be destroyed",
          "Destroyed so it is unreadable, indecipherable, and irrecoverable — e.g., cross-cut shredding to the required standard — never tossed in regular trash or recycling",
          "Torn in half and thrown away"
        ],

    subtitle: "Real-world failure patterns — mismarking, commingling, oversharing, improper email — framed as cautionary cases to recognize and avoid.",
    time: "30 min", type: "Marking & Handling",
    video: { id: "jvYgzfxuQEI", title: "CUI Management Mishaps: Avoid These Blunders! (On Call Compliance)" },
    resource: { type: "reference", items: [
      { label: "DoD CUI Training page — desktop aids & quick references", url: "https://www.dodcui.mil/Training/" },

    ], expansion: "Most CUI mistakes are routine-workflow mistakes: unmarked working papers, personal email, unauthorized cloud shares, over-broad distribution lists, and screens/printouts left exposed. The DoD desktop aids are designed as at-the-desk reminders for exactly these moments. A useful habit: before any send, share, or print of technical data, run the three questions — *Is it CUI? Is this channel authorized? Does every recipient have need-to-know (and authorization, if export-controlled)?*" },
    content: [
      { type: "p", text: "Knowing the rules and applying them reliably are different skills. This lesson is a catalogue of the failure patterns that actually cause CUI incidents — recognizing them is half the battle, because most happen through inattention rather than ignorance." },

      { type: "h3", text: "Mistake 1: Under-Marking or Mismarking" },

      { type: "p", text: "The failure: marking CUI Specified as Basic, omitting category markings, or failing to mark CUI at all. The consequence: downstream handlers don't apply the right protections because the marking — their instruction set — is wrong or missing. The fix: when you create or derive a CUI document, mark it according to the source material and your guidance; when you receive something that seems mismarked, raise it with your security office rather than acting on the wrong marking or 'correcting' it yourself." },

      { type: "h3", text: "Mistake 2: Commingling" },

      { type: "p", text: "The failure: mixing CUI with non-CUI in the same document, folder, or system without proper marking, so the CUI becomes invisible — or, conversely, dumping CUI into a general-purpose system not authorized to hold it. The consequence: CUI ends up in places without the required protections, and people handle it unaware. The fix: keep CUI in authorized locations, mark mixed documents properly (portion marking helps here), and don't drop CUI into convenient-but-unauthorized tools (random cloud drives, personal accounts, unapproved chat apps)." },

      { type: "h3", text: "Mistake 3: Over-Sharing / Need-to-Know Erosion" },

      { type: "p", text: "The failure: 'cc-ing the whole team,' forwarding CUI to people who don't need it, or treating 'works here' as equivalent to need-to-know. The consequence: the controlled-access principle erodes, expanding the exposure surface and sometimes pushing CUI to people not authorized to have it at all (e.g., a foreign-person colleague receiving export-controlled CUI). The fix: send CUI only to those with a genuine functional need, scrutinize recipient lists before sending, and be especially careful with export-controlled CUI where the recipient's nationality matters." },

      { type: "h3", text: "Mistake 4: Improper Email & Transmission" },

      { type: "p", text: "The failure: emailing CUI unencrypted, sending it to a personal email account, or transmitting it through channels not authorized for CUI. The consequence: CUI traverses or lands in unprotected places. The fix is covered in depth in the next lesson, but the headline: CUI in transit needs protection (encryption), authorized channels only, and never personal accounts or unapproved services. Email is the single most common vector for CUI incidents because it's so frictionless." },

      { type: "h3", text: "Mistake 5: Treating Unclassified as Unprotected" },

      { type: "p", text: "The failure: the attitude that 'it's only CUI, not classified, so I don't need to be careful.' The consequence: every other mistake on this list, downstream of a casual mindset. The fix: internalize that CUI is mandatory-protection information with real consequences for mishandling — different from classified, but not optional." },

      { type: "h3", text: "Mistake 6: Assuming Decontrol" },

      { type: "p", text: "The failure: deciding on your own that something is 'old' or 'probably public now' and handling it as uncontrolled. The consequence: premature release of still-controlled information. The fix: treat CUI as controlled until authoritatively decontrolled by the proper authority." },

      { type: "h3", text: "The Pattern Behind the Patterns" },

      { type: "p", text: "Notice the common thread: nearly every mistake is a convenience shortcut or a casual assumption, not a deliberate act. The person cc-ing the team is trying to be helpful; the person emailing unencrypted is trying to be fast; the person tossing a draft is trying to clear their desk. CUI discipline is fundamentally about resisting the frictionless wrong action in favor of the slightly-more-effortful right one. When something feels too easy — one click to share, one toss to dispose — that's the moment to pause and check. The next phase turns to the systems and transmission rules where these mistakes most often play out." }

  {

    title: "Transmission Rules",
    subtitle: "Moving CUI safely: email and encryption requirements, portable media, physical mail and fax — what's permitted and what isn't.",
    time: "35 min", type: "Transmission & Systems",
    video: null,
    resource: { type: "reference", items: [
      { label: "NIST SP 800-171 Rev 2 — System & Communications Protection", url: "https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final" },
      { label: "32 CFR Part 2002 — CUI safeguarding (eCFR)", url: "https://www.ecfr.gov/current/title-32/part-2002" },
      { label: "DoDI 5200.48 §5 — transmission & email requirements (PDF)", url: "https://www.dodcui.mil/Portals/109/Documents/Policy%20Docs/DoDI%205200.48%20CUI.pdf" }
    ], expansion: "The transmission rules trace to the **System and Communications Protection** family in NIST SP 800-171 Rev 2 — cryptographic protection of CUI confidentiality in transit, in practice FIPS-validated encryption. DoDI 5200.48 adds the explicit prohibition on personal (.com/.net) email accounts and non-DoD systems for CUI except where approved. Practical rules: encrypt in transit, authorized channels and accounts only, verify every recipient, and watch attachments and growing email threads. If a channel isn't clearly authorized, confirm before sending." },
    content: [
      { type: "p", text: "Transmission is where CUI is most exposed — the moment it leaves your controlled environment and travels to another. It's also where the most frequent incidents occur, because transmitting is so frictionless (one click to send an email). This lesson covers the rules for moving CUI safely." },

      { type: "h3", text: "The Core Principle: Protect CUI In Transit" },

      { type: "p", text: "Whenever CUI moves, it must be protected against interception or access by unauthorized parties along the way. For digital transmission, this overwhelmingly means **encryption**. The baseline expectation is that CUI is encrypted when transmitted, using cryptography that meets the applicable federal standard — in practice, FIPS-validated encryption is the benchmark that NIST SP 800-171 points to for protecting CUI confidentiality in transit." },

      { type: "h3", text: "Email — The Highest-Risk Channel" },

      { type: "p", text: "Email causes more CUI incidents than any other channel because it's so easy to get wrong:" },

      { type: "ul", items: [
        "**Encrypt CUI in email** — CUI sent by email must be encrypted (e.g., via your organization's approved email encryption, S/MIME, or an approved secure-transfer mechanism). Plaintext email across the open internet is not acceptable for CUI.",
        "**Authorized accounts and systems only** — send from and to organizational accounts on systems authorized to handle CUI. Never route CUI through a personal email account (yours or the recipient's).",
        "**Scrutinize recipients** — confirm every recipient has need-to-know, and for export-controlled CUI confirm recipients are authorized persons. The 'reply-all' and autocomplete-wrong-recipient errors are classic email incidents.",
        "**Watch attachments and threads** — a marked CUI attachment on an unencrypted email, or CUI quoted in a forwarded thread that picks up new recipients, are easy-to-miss exposures."
      ]},

      { type: "h3", text: "Portable Media" },

      { type: "p", text: "USB drives, external disks, and similar media carrying CUI must be encrypted and physically controlled. Removable media is a notorious loss vector — drives are small and easily misplaced — so the data on them must be protected (encryption) such that loss of the device isn't automatically loss of the CUI. Many organizations restrict or prohibit removable media for CUI entirely; follow your organization's policy, which may be stricter than the baseline." },

      { type: "h3", text: "Physical Mail and Hand-Carry" },

      { type: "p", text: "When CUI travels physically (printed documents, media):" },

      { type: "ul", items: [
        "**Use methods that protect against unauthorized disclosure** — appropriate packaging (opaque envelopes/wrapping that doesn't reveal contents or markings externally) and tracked/accountable carriers as the sensitivity warrants.",
        "**Don't expose markings externally** — the package exterior shouldn't advertise that it contains CUI.",
        "**Hand-carry with control** — if carrying CUI personally, keep it under your control and protected from casual viewing (the clean-desk discipline from Lesson 7 extends to travel)."
      ]},

      { type: "h3", text: "Fax and Voice" },

      { type: "p", text: "Fax transmission of CUI should use secure fax to a verified recipient at a controlled receiving end (an unattended fax machine in a shared area defeats the purpose). For voice, be aware of who can overhear discussions of CUI — speakerphone in an open area, calls in public spaces, and voicemail systems are all potential exposures." },

      { type: "h3", text: "The Transmission Checklist" },

      { type: "p", text: "Before transmitting CUI by any means, run the mental checklist: Is the channel authorized for CUI? Is the content encrypted/protected appropriately for the medium? Does every recipient have need-to-know (and authorized-person status for export-controlled CUI)? Are the markings intact? Is anything riding along that shouldn't be (extra attachments, expanded thread recipients)? The few seconds this takes is the cheapest insurance against the most common category of CUI incident. When the channel or method isn't clearly authorized, stop and confirm with your security office before sending." }
    ],

  {
    phase: "Phase 3", phaseColor: "#1a6b3c",
    title: "CUI on Information Systems",
    subtitle: "Protecting CUI in non-federal systems: the role of NIST SP 800-171, its control families, and the Revision 2 vs. Revision 3 reality.",
    time: "40 min", type: "Transmission & Systems",
    video: { id: "QjATSFebmyA", title: "Marking CUI in Your I.T. Environment (Summit 7 / CS2 San Diego)" },
    resource: { type: "reference", items: [
      { label: "NIST SP 800-171 Rev 2 (full publication)", url: "https://csrc.nist.gov/pubs/sp/800/171/r2/upd1/final" },
      { label: "SPRS — Supplier Performance Risk System (score reporting)", url: "https://www.sprs.csd.disa.mil/" }
    ], expansion: "**NIST 800-171 Rev 2** — 110 requirements across 14 families — is the enforced standard for protecting CUI on contractor systems (Rev 3 exists but is not yet contractually required; DoD keeps Rev 2 via class deviation). Contractors self-assess against it and report scores in **SPRS**, which contracting officers check. The system boundary matters as much as the controls: knowing exactly which systems store, process, or transmit CUI defines what must comply." },
    content: [
      { type: "p", text: "Most CUI today lives on computers and networks — and when those are non-federal systems (a contractor's own IT), there's a specific standard that defines how to protect it: NIST Special Publication 800-171. This lesson explains what it is and the version situation you need to understand, without turning into a control-by-control checklist (that's a compliance specialist's job, not this track's)." },

      { type: "h3", text: "What NIST SP 800-171 Is" },

      { type: "p", text: "NIST SP 800-171 is titled 'Protecting Controlled Unclassified Information in Nonfederal Systems and Organizations.' It's the standard that specifies the security requirements a contractor's information systems must meet to protect CUI confidentiality. It's a tailored subset of the much larger NIST SP 800-53 controls, adapted for non-federal organizations. For the defense industrial base, compliance with 800-171 is contractually required through DFARS 252.204-7012." },

      { type: "h3", text: "The Control Families" },

      { type: "p", text: "800-171 organizes its requirements into control families covering the major dimensions of information security. In the currently-enforced revision (Rev 2), these are 14 families including Access Control, Awareness and Training, Audit and Accountability, Configuration Management, Identification and Authentication, Incident Response, Maintenance, Media Protection, Personnel Security, Physical Protection, Risk Assessment, Security Assessment, System and Communications Protection, and System and Information Integrity. The point to absorb is the breadth: protecting CUI on systems isn't one thing (like encryption) — it's access control, monitoring, configuration discipline, training, incident response, and more, working together." },

      { type: "h3", text: "The Revision 2 vs. Revision 3 Situation — Read Carefully" },

      { type: "p", text: "This is the single most important currency point in this track, and getting it wrong leads people astray. As of early 2026:" },

      { type: "ul", items: [
        "**Revision 2 is the enforced standard.** It has 110 security requirements across 14 families. This is the version that CMMC Level 2 assessments are conducted against, the version your System Security Plan and SPRS score must reflect, and the version assessors benchmark.",
        "**Revision 3 exists but is NOT yet required.** NIST finalized Rev 3 in May 2024 — it reduced the count from 110 to 97 requirements, added new control families (including Planning and Supply Chain Risk Management), and introduced Organization-Defined Parameters. But the DoD has NOT authorized Rev 3 for compliance scoring, SPRS reporting, or CMMC assessments. Under a DoD Class Deviation, contractors continue using Rev 2.",
        "**The transition will come via rulemaking, later.** DoD has said it will move to Rev 3 through future rulemaking (likely sometime in the 2026–2027+ window), but until that happens, Rev 2 is the only enforceable standard for CMMC."
      ]},

      { type: "p", text: "**The practical guidance:** for DoD/CMMC compliance today, comply with Rev 2 (110 controls). Don't align solely to Rev 3 thinking you're ahead — you could show 'unmet' Rev 2 requirements and fail an assessment. Track Rev 3 to prepare for the eventual transition, but build your compliance posture on Rev 2 until the rules change. Always confirm the current enforced revision with your security/compliance office before relying on it." },

      { type: "h3", text: "What This Means for You as an Individual" },

      { type: "p", text: "Most engineers won't implement 800-171 controls personally — that's the IT/security organization's job. But you live inside those controls every day: the access permissions on your CUI systems, the requirement to use multi-factor authentication, the prohibition on installing unapproved software, the monitoring of your activity, the rule against moving CUI to unauthorized systems. Understanding that these aren't arbitrary IT annoyances but the literal mechanism of CUI compliance helps you work with them rather than around them. The engineer who emails CUI to a personal Gmail to 'work from home more easily' has just defeated a stack of 800-171 controls in one click." }
    ],

  {

    title: "Cloud & FedRAMP",
    subtitle: "When CUI lives in the cloud: the FedRAMP Moderate Baseline requirement, what 'in-boundary' means, and shared responsibility.",
    time: "35 min", type: "Transmission & Systems",
    video: null,
    resource: { type: "reference", items: [
      { label: "FedRAMP Marketplace — verify provider authorization", url: "https://marketplace.fedramp.gov/" },
      { label: "DFARS 252.204-7012(b)(2)(ii)(D) — cloud provision (eCFR)", url: "https://www.ecfr.gov/current/title-48/chapter-2/subchapter-H/part-252/subpart-252.2/section-252.204-7012" },
      { label: "FedRAMP program — official site", url: "https://www.fedramp.gov/" }
    ], expansion: "DFARS 252.204-7012 requires that an external cloud service provider used to store, process, or transmit covered defense information meet security requirements **equivalent to the FedRAMP Moderate baseline**. Use the Marketplace to confirm a provider's status before placing CUI in it — and remember the shared-responsibility model: an authorized cloud secures the infrastructure, but configuration, access control, and data handling within it remain your responsibility. Authorized cloud is necessary, not sufficient." },
    content: [
      { type: "p", text: "Increasingly, CUI is stored, processed, or transmitted in cloud services rather than on-premises servers. The cloud introduces a specific requirement that's easy to overlook: not every cloud service is authorized to hold CUI, and using the wrong one is a compliance failure even if the service is otherwise excellent." },

      { type: "h3", text: "The FedRAMP Moderate Baseline Requirement" },

      { type: "p", text: "When a cloud service is used to store, process, or transmit CUI, that cloud service provider must meet the **FedRAMP Moderate Baseline** security controls (or equivalent). FedRAMP (the Federal Risk and Authorization Management Program) is the government's standardized program for authorizing cloud services, and 'Moderate' is the baseline level relevant to CUI. The proposed FAR CUI Rule makes this explicit: where a contractor uses a cloud service provider to store, process, or transmit CUI, that provider must meet FedRAMP Moderate Baseline standards." },

      { type: "p", text: "The practical consequence: you cannot simply drop CUI into any convenient consumer cloud service (a personal Dropbox, a free Google Drive, a random file-sharing site). The service must be one authorized to the appropriate level. Many organizations maintain a specific authorized cloud environment for CUI for exactly this reason." },

      { type: "h3", text: "Government Cloud Tiers" },

      { type: "p", text: "For DoD work especially, you'll encounter cloud environments built to meet these requirements — commercial clouds offer government-specific regions and tiers (often referenced as GCC, GCC High, and DoD-specific tiers for Microsoft environments, and equivalent offerings from other providers) that are configured and authorized for controlled data. Which tier is appropriate depends on the data — for example, ITAR/export-controlled CUI typically demands the higher tiers that ensure data residency and personnel restrictions. The right answer for your situation comes from your contract and security office, not from a general rule." },

      { type: "h3", text: "The Shared Responsibility Model" },

      { type: "p", text: "A critical concept that trips up many organizations: using a FedRAMP-authorized cloud does NOT automatically make you compliant. Cloud security is a **shared responsibility**:" },

      { type: "ul", items: [
        "**The cloud provider** is responsible for the security OF the cloud — the infrastructure, the physical data centers, the platform-level controls covered by their FedRAMP authorization.",
        "**You (the customer)** remain responsible for security IN the cloud — how you configure it, who you grant access to, how you handle the data within it, and the controls that are yours to implement.",
        "**The implication:** an authorized cloud is necessary but not sufficient. You can absolutely mishandle CUI inside a perfectly-compliant FedRAMP environment by misconfiguring access, over-sharing, or moving data improperly. The authorization covers the provider's layer; your handling discipline covers yours."
      ]},

      { type: "h3", text: "Managed Service Providers" },

      { type: "p", text: "Many contractors rely on Managed Service Providers (MSPs) for IT. An important nuance: when an MSP provides services that touch CUI (cloud infrastructure, security tools), the MSP is typically pulled into the scope of the contractor's compliance — its practices must support the contractor's obligations and be ready for assessment. If your organization uses an MSP for CUI-relevant systems, their security posture is part of your compliance story, not separate from it." },

      { type: "h3", text: "The Takeaway for Individuals" },

      { type: "p", text: "For the individual engineer, the cloud rules reduce to a simple discipline: use only the cloud environments your organization has authorized for CUI, and don't improvise. The convenient consumer tool — the personal cloud drive, the quick file-sharing link, the unapproved collaboration app — is precisely the trap, because it works perfectly well technically while being completely non-compliant. When you need to store or share CUI and the authorized path feels inconvenient, that friction is the control working as intended; route around it through your security office, not through a consumer service." }

      { type: "h3", text: "The DFARS 252.204-7012 Reporting Requirement" },

      { type: "p", text: "For defense contractors, the clause DFARS 252.204-7012 ('Safeguarding Covered Defense Information and Cyber Incident Reporting') does two things: it requires implementing NIST SP 800-171 to protect CUI (covered in Lesson 10), and it imposes a **cyber incident reporting obligation**. When a contractor discovers a cyber incident affecting covered defense information (which includes CUI) or the contractor's ability to perform, it must report rapidly." },

    subtitle: "The Cybersecurity Maturity Model Certification: what it is, what Level 2 means for CUI handlers, self-assessment vs. C3PAO, and the phased rollout reality.",
    time: "40 min", type: "Obligations & Landscape",
    video: { id: "ND60r02-_1M", title: "CMMC Scoping Part 2 — CUI Assets & Controlled Unclassified Information (Kieri Solutions)" },

    content: [
      { type: "p", text: "CMMC is the framework that puts teeth into CUI protection for the defense industrial base. For years, contractors self-attested to implementing NIST 800-171, with limited verification. CMMC changes that — it adds assessment and certification, making 'we protect CUI' something you increasingly have to prove, not just assert. This lesson explains it in plain terms." },

      { type: "h3", text: "What CMMC Is" },

      { type: "p", text: "The Cybersecurity Maturity Model Certification (CMMC) is a DoD program that verifies defense contractors have implemented the required cybersecurity controls to protect FCI and CUI. It's established by the regulation 32 CFR Part 170 (the 'program rule', effective December 2024) and made contractually enforceable through the DFARS acquisition rule (48 CFR, effective November 10, 2025). In essence: NIST 800-171 says what controls to implement; CMMC verifies that you actually did." },

      { type: "h3", text: "The Levels" },

      { type: "p", text: "CMMC has tiered levels matched to the sensitivity of the information:" },

      { type: "ul", items: [
        "**Level 1** — for contractors handling FCI (the broad, lower tier). Based on the 15 basic safeguarding requirements of FAR 52.204-21. Self-assessment.",
        "**Level 2** — for contractors handling CUI. This is the one that matters for CUI handlers. Aligned to NIST SP 800-171 Revision 2's 110 controls. Depending on the contract, Level 2 may be met by self-assessment or may require a certified third-party assessment.",
        "**Level 3** — for the highest-sensitivity programs. Builds on Level 2 with additional controls (drawn from NIST SP 800-172) and is assessed by the government (DIBCAC)."
      ]},

      { type: "p", text: "For most CUI-handling aerospace contractors, **Level 2 is the target**, and the central question is whether your contracts require a self-assessment or a third-party certified assessment." },

      { type: "h3", text: "Self-Assessment vs. C3PAO" },

      { type: "p", text: "The big shift CMMC introduces is third-party verification for higher-stakes Level 2:" },

      { type: "ul", items: [
        "**Self-assessment** — the contractor assesses its own compliance, documents it (System Security Plan and SPRS score), and an official affirms it. Some Level 2 contracts permit this.",
        "**C3PAO assessment** — a Certified Third-Party Assessment Organization independently assesses and certifies compliance. Other Level 2 contracts require this, removing self-attestation as the basis.",
        "**POA&Ms are limited** — a Plan of Action and Milestones (for fixing gaps) is allowed but constrained: CMMC limits how many open items you can have at award and requires closing them within 180 days."
      ]},

      { type: "h3", text: "The Phased Rollout (Current Reality)" },

      { type: "p", text: "CMMC is rolling out over four phases, each beginning one year apart, starting from the November 10, 2025 effective date:" },

      { type: "table", headers: ["Phase", "Begins", "What it requires"],
        rows: [
          ["Phase 1", "Nov 10, 2025", "Level 1/2 self-assessments as pre-award conditions; DoD may require Level 2 C3PAO at its discretion for select contracts"],
          ["Phase 2", "Nov 10, 2026", "Mandatory Level 2 C3PAO certification becomes standard for applicable contracts; Level 3 introduced"],
          ["Phase 3", "Nov 10, 2027", "Level 2 C3PAO across a broader range; Level 3 DIBCAC assessments for high-priority programs"],
          ["Phase 4", "Nov 10, 2028", "Full implementation — all applicable DoD contracts require the appropriate CMMC level as a condition of award"]
        ]
      },

      { type: "p", text: "The date most CUI-handling contractors should plan around is **November 10, 2026 (Phase 2)** — when mandatory third-party certification becomes standard for applicable contracts. Because achieving Level 2 typically takes 6–12 months of work, the practical message across the industry is that preparation needs to be underway now, not deferred to 2028. This is the 'urgent and current' nature of the topic." },

      { type: "h3", text: "What This Means for the Individual" },

      { type: "p", text: "An engineer doesn't get CMMC-certified personally — the organization does. But the certification rests entirely on individual behavior. Every control CMMC verifies is something people must actually do: use MFA, handle CUI on authorized systems, follow the marking and transmission rules, report incidents. An assessor checking Level 2 compliance is, in effect, checking whether the people in the organization handle CUI the way this entire track describes. Individual discipline is not separate from CMMC compliance — it IS CMMC compliance, observed at the level of daily behavior." }

      { label: "SPRS — where sub scores are visible to primes/COs", url: "https://www.sprs.csd.disa.mil/" }
    ], expansion: "Flow-down is a contractual mechanism: DFARS 7012 paragraph (m) requires primes to include the clause's safeguarding and reporting requirements in subcontracts where the sub will handle covered defense information, and each tier flows it down in turn. CMMC status flows down under 32 CFR 170 — a sub handling CUI must hold the applicable level itself, and primes verify status before awarding CUI-bearing work. The CUI carries its obligations with it down the supply chain; a sub that can't demonstrate status may be unable to receive the work. Confirm specific terms with your contracts and security teams." },
